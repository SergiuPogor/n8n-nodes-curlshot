# Publishes n8n-nodes-curlshot to npm with a provenance statement whenever a
# version tag (for example 0.1.0) is pushed. n8n requires community nodes to
# be published from GitHub Actions with provenance since 1 May 2026.
#
# Authentication, either of:
#   - NPM_TOKEN repository secret: an npm granular access token with read and
#     write access to n8n-nodes-curlshot (needed for the very first publish).
#   - npm trusted publishing (OIDC): once the package exists, add this repo and
#     workflow file (publish.yml) as a trusted publisher on npmjs.com and the
#     secret can be deleted.
#
# Release: bump "version" in package.json on main (via a PR), then push a
# tag with the same version: git tag 0.1.0 && git push origin 0.1.0

name: Publish

on:
  push:
    tags:
      # Plain semver release tags only (0.1.0), never 1.0.0-rc.1 or foo.bar.baz.
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Every action, tool and package in this job is pinned: it can mint an
    # OIDC token and holds the npm token. The scan runs in its own job.
    permissions:
      # Mints the OIDC token npm uses for the provenance attestation.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) needs npm 11.5 or later.
      - name: Update npm
        run: npm install -g npm@11.21.0

      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm test

      - name: Publish with provenance
        # `n8n-node release` in CI runs lint and build, then `npm publish`
        # with NPM_CONFIG_PROVENANCE=true.
        run: npm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  scan:
    name: n8n community package scan
    needs: publish
    runs-on: ubuntu-latest
    # No id-token and no secrets: this job only reads the published package.
    permissions:
      contents: read

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Scan the published version
        run: |
          for attempt in 1 2 3 4 5 6; do
            if npx -y @n8n/scan-community-package@0.39.0 "n8n-nodes-curlshot@$GITHUB_REF_NAME" | tee scan.log && grep -q 'passed all security checks' scan.log; then
              exit 0
            fi
            echo "Scan not passing yet (attempt $attempt); the registry may still be propagating."
            sleep 30
          done
          exit 1
